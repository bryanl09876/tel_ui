<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 15px; margin: 0;
            background-color: var(--tg-theme-bg-color, #1c1c1d);
            color: var(--tg-theme-text-color, #ffffff);
        }
        .section { margin-top: 2px; border-bottom: 1px solid var(--tg-theme-hint-color, #3a3a3c); padding-bottom: 10px; margin-bottom: 15px; }
        .section h3 { margin: 0 0 10px 0; font-size: 16px; color: var(--tg-theme-button-color, #007aff); }
        .section_lb h3 { margin: 0 0 10px 0; font-size: 16px; color: #d11919; }
        .section_fwd h3 { margin: 0 0 10px 0; font-size: 16px; color: #33cc33; }
        .section_ovpn h3 { margin: 0 0 10px 0; font-size: 16px; color: orange; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--tg-theme-hint-color, #98989e); }
        input, select {
            width: 100%; padding: 10px; box-sizing: border-box; font-size: 14px;
            border: 1px solid var(--tg-theme-hint-color, #3a3a3c); border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
        }
        .btn {
            width: 100%; padding: 14px; margin-bottom: 10px; border: none; border-radius: 50px;
            font-size: 16px; font-weight: bold; cursor: pointer; display: block;
        }
        .btn-gh { background-color: blue; color: white; }
        .btn-lb { background-color: red; color: white; }
        .btn-fwd { background-color: green; color: white; }
        .btn-ovpn { background-color: orange; color: white; }
        .btn-back { background-color: transparent; color: var(--tg-theme-text-color); border: 1px solid var(--tg-theme-hint-color); }
        /* Utility classes for hiding elements */
        .hidden { display: none !important; }
        /* Validation feedback (see validateForm) */
        input.invalid { border-color: #d11919; }
        .field-error { color: #ff6b6b; font-size: 12px; margin-top: 4px; }
        .msg-box { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
        .msg-box ul { margin: 6px 0 0; padding-left: 18px; }
        .msg-box li { margin-bottom: 3px; }
        .msg-error { background: rgba(209, 25, 25, 0.15); border: 1px solid #d11919; }
        .msg-warn { background: rgba(255, 165, 0, 0.15); border: 1px solid orange; }
    </style>
</head>
<body>

    <div id="main_menu">
        <h2 style="text-align: center; margin-bottom: 20px;">Select Deployment Type</h2>
        <button class="btn btn-gh" onclick="showForm('gh')">🚀 Configure GH Setup</button>
        <button class="btn btn-lb" onclick="showForm('lb')">🛡️ Configure LB Relay</button>
        <button class="btn btn-fwd" onclick="showForm('fwd')">⏩ Configure FWD Relay</button>
        <button class="btn btn-ovpn" onclick="showForm('ovpn')">🔑 Configure OpenVPN LB </button>
    </div>

    <div id="form_container" class="hidden">

        <button class="btn btn-back" onclick="goBack()">⬅️ Back to Menu</button>

        <div id="infrastructure_section" class="section">
            <h3>🌍 Infrastructure Setup 🌍</h3>
            <div class="form-group">
                <label>Cloud Provider</label>
                <select id="provider" onchange="updateRegions()">
                    <option value="vultr">VULTr</option>
                    <option value="digitalocean">DigitalOcean</option>
                </select>
            </div>
            <div class="form-group">
                <label>Region</label>
                <select id="region_ID"></select>
            </div>
            <div class="form-group"><label>Node A Hostname</label><input type="text" id="vps_hostname_A" placeholder="e.g., alpha"></div>
            <div class="form-group"><label>Node B Hostname</label><input type="text" id="vps_hostname_B" placeholder="e.g., bravo"></div>
        </div>

        <div id="tunnel_section" class="section">
            <h3>🚇 Tunnel Configuration 🚇</h3>
            <div class="form-group">
                <label>Tunnel Type</label>
                <select id="tun_type">
                    <option value="gre">GRE</option>
                    <option value="vxlan">VXLAN</option>
                </select>
            </div>
            <div class="form-group"><label>VXLAN ID (Dont remove 5000 unless !=5000)</label><input type="text" id="vxlan_id" value="5000"></div>
            <div class="form-group"><label>Tunnel Public Dest IP</label><input type="text" id="tun_pub_dest_ip" placeholder="1.2.3.4"></div>
            <div class="form-group"><label>Tunnel Interface IP</label><input type="text" id="tun_interface_ip" placeholder="10.58.x.x/30"></div>
            <div class="form-group"><label>Tunnel Next Hop IP</label><input type="text" id="tun_nexthop_ip" placeholder="10.58.x.x"></div>
            <div class="form-group"><label>Tunnel Routed Subnet</label><input type="text" id="tun_routed_subnet" placeholder="10.60.x.x/28"></div>
        </div>

        <div id="dnat_section" class="section_lb hidden">
            <h3>🛡️ DNAT Settings 🛡️</h3>
            <div class="form-group"><label>OpenVPN Dest IP (1194)</label><input type="text" id="dest_ip_ovpn" placeholder="e.g., 10.60.x.x"></div>
            <div class="form-group"><label>IPsec Dest IP (500/4500)</label><input type="text" id="dest_ipsec" placeholder="e.g., 10.60.x.x"></div>
        </div>

        <div id="fwd_section" class="section_fwd hidden">
            <h3>⏩ Port Forwarding  ⏩</h3>
            <div class="form-group"><label>Forwarding Port ex. 1194</label><input type="text" id="forwarding_port" placeholder="Port Number"></div>
            <div class="form-group"><label>Final Destination IP</label><input type="text" id="dest_ip" placeholder="e.g., 10.60.x.x"></div>
        </div>

        <div id="ovpn_section" class="section_ovpn hidden">
            <h3> 🔑 OpenVPN 🔑 </h3>
            <div class="form-group"><label>OpenVPN Listening Port ex. 1194</label>
            <input type="text" id="sPort" placeholder="Port Number" value="1194">
            </div>
            <div class="form-group">
                <label>VPN Protocol</label>
                <select id="tcp_udp">
                    <option value="udp">udp</option>
                    <option value="tcp">tcp</option>
                </select>
            </div>
        </div>

        <!-- Validation summary. Filled by submitForm(); hidden until needed. -->
        <div id="form_messages" class="msg-box hidden"></div>

        <button id="btn_submit_gh" class="btn btn-gh hidden" onclick="submitForm('deploy_gh')">🚀 Deploy GH Setup</button>
        <button id="btn_submit_lb" class="btn btn-lb hidden" onclick="submitForm('deploy_lb')">🛡️ Deploy LB Relay</button>
        <button id="btn_submit_fwd" class="btn btn-fwd hidden" onclick="submitForm('deploy_fwd')">⏩ Deploy FWD Relay</button>
        <button id="btn_submit_ovpn" class="btn btn-ovpn hidden" onclick="submitForm('deploy_ovpn')"> 🔑 Deploy OpenVPN LB </button>
    </div>

    <script>
        Telegram.WebApp.ready();
        // SECURITY LOCK: Prevent opening in a normal browser
        if (Telegram.WebApp.platform === "unknown") {
            // If they aren't in Telegram, delete the whole app from the screen!
            document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:#d11919;'>⛔ Access Denied.</h2>";
            throw new Error("Because");
        }
        Telegram.WebApp.expand();

        // Region lists per provider. The values are the region_ID numbers the
        // orchestrators expect: Vultr -> vultr_regions, DO -> do_regions.
        const REGIONS = {
            vultr: [
                ["9","Singapore (sgp) - 9"], ["12","Frankfurt (fra) - 12"], ["15","London (lhr) - 15"],
                ["16","Manchester (man) - 16"], ["17","Amsterdam (ams) - 17"], ["18","Warsaw (waw) - 18"],
                ["19","Stockholm (sto) - 19"], ["21","Mexico City (mex) - 21"], ["22","Atlanta (atl) - 22"],
                ["24","New Jersey (ewr) - 24"], ["27","Miami (mia) - 27"], ["28","Chicago (ord) - 28"],
                ["30","Silicon Valley (sjc) - 30"]
            ],
            digitalocean: [
                ["1","New York 1 (nyc1)"], ["6","Frankfurt 1 (fra1)"], ["7","London 1 (lon1)"],
                ["5","Amsterdam 3 (ams3)"] 
            ]
        };

        // Repopulate the Region dropdown to match the selected provider.
        function updateRegions() {
            const provider = document.getElementById('provider').value;
            const sel = document.getElementById('region_ID');
            sel.innerHTML = '';
            REGIONS[provider].forEach(function (r) {
                const opt = document.createElement('option');
                opt.value = r[0];
                opt.textContent = r[1];
                sel.appendChild(opt);
            });
        }
        updateRegions();  // populate on load (defaults to Vultr)

        function showForm(type) {
            document.getElementById('main_menu').classList.add('hidden');
            document.getElementById('form_container').classList.remove('hidden');
            clearFeedback();   // drop red marks / messages left over from another form

            // 1. Reset everything to hidden
            document.getElementById('dnat_section').classList.add('hidden');
            document.getElementById('fwd_section').classList.add('hidden');
            document.getElementById('ovpn_section').classList.add('hidden');
            // Reset ALL buttons to hidden
            document.getElementById('btn_submit_gh').classList.add('hidden');
            document.getElementById('btn_submit_lb').classList.add('hidden');
            document.getElementById('btn_submit_fwd').classList.add('hidden');
            document.getElementById('btn_submit_ovpn').classList.add('hidden');

            // 2. Assume infrastructure/tunnel are visible by default
            document.getElementById('infrastructure_section').classList.remove('hidden');
            document.getElementById('tunnel_section').classList.remove('hidden');

            // 3. Turn on exactly what we need
            if (type === 'gh') {
                document.getElementById('dnat_section').classList.remove('hidden');
                document.getElementById('btn_submit_gh').classList.remove('hidden');
                document.getElementById('ovpn_section').classList.add('hidden');

            } else if (type === 'lb') {
            	document.getElementById('ovpn_section').classList.add('hidden');
                document.getElementById('btn_submit_lb').classList.remove('hidden');

            } else if (type === 'fwd') {
                // Keep the Infrastructure section VISIBLE
                // hide  tunnel and ovpn section!
                document.getElementById('tunnel_section').classList.add('hidden');
                document.getElementById('ovpn_section').classList.add('hidden');

                // Show FWD settings and button
                document.getElementById('fwd_section').classList.remove('hidden');
                document.getElementById('btn_submit_fwd').classList.remove('hidden');

            } else if (type === 'ovpn') {
                // Keep the Infrastructure section VISIBLE (Vultr needs Region/Names)
                // Only hide the Tunnel section!
                document.getElementById('tunnel_section').classList.add('hidden');

                // Show FWD settings and button
                document.getElementById('ovpn_section').classList.remove('hidden');
                document.getElementById('btn_submit_ovpn').classList.remove('hidden');
            }
        }

        function goBack() {
            clearFeedback();
            document.getElementById('form_container').classList.add('hidden');
            document.getElementById('main_menu').classList.remove('hidden');
        }

        // ==================================================================
        // INPUT VALIDATION
        // Every network value is checked here BEFORE Telegram.WebApp.sendData
        // fires. A typo like 10.600.31.166 used to reach the bot and only blow
        // up minutes later in iptables-restore on the new node; now it never
        // leaves the app. Only inputs inside a VISIBLE section are checked, so
        // each deployment type is validated against exactly the fields its
        // playbook consumes (site_gh / site_lb / site_fwd vars_prompt).
        // ==================================================================

        // --- pure validation helpers (start) ---
        // Strict dotted-quad: each octet 0-255, no leading zeros, IPv4 only.
        const OCTET = '(25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]?\\d)';
        const IPV4_RE = new RegExp('^' + OCTET + '(\\.' + OCTET + '){3}$');

        function parseIPv4(str) {
            return IPV4_RE.test(str) ? str.split('.').map(Number) : null;
        }
        function ipToInt(octets) {
            return ((octets[0] << 24) | (octets[1] << 16) | (octets[2] << 8) | octets[3]) >>> 0;
        }
        function intToIp(n) {
            return [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
        }
        // "a.b.c.d/nn" -> {addr, prefix, mask, network}, or null if malformed.
        function parseCIDR(str) {
            const parts = str.split('/');
            if (parts.length !== 2 || !/^\d{1,2}$/.test(parts[1])) return null;
            const ip = parseIPv4(parts[0]);
            const prefix = Number(parts[1]);
            if (!ip || prefix > 32) return null;
            const mask = prefix === 0 ? 0 : (0xFFFFFFFF << (32 - prefix)) >>> 0;
            const addr = ipToInt(ip);
            return { addr: addr, prefix: prefix, mask: mask, network: (addr & mask) >>> 0 };
        }
        function inNetwork(octets, cidr) {
            return ((ipToInt(octets) & cidr.mask) >>> 0) === cidr.network;
        }
        function isInt(str, min, max) {
            return /^\d+$/.test(str) && Number(str) >= min && Number(str) <= max;
        }

        // What each input must contain.
        //   ip   = bare IPv4  (iptables -s / --to-destination, tunnel remote, next hop)
        //   cidr = IPv4/prefix (nmcli ipv4.addresses / ipv4.routes, iptables -d)
        //   port = 1-65535,  vni = VXLAN ID 1-16777215,  text = just non-empty
        const RULES = {
            vps_hostname_A:    { kind: 'text', label: 'Node A Hostname' },
            vps_hostname_B:    { kind: 'text', label: 'Node B Hostname' },
            vxlan_id:          { kind: 'vni',  label: 'VXLAN ID' },
            tun_pub_dest_ip:   { kind: 'ip',   label: 'Tunnel Public Dest IP' },
            tun_interface_ip:  { kind: 'cidr', label: 'Tunnel Interface IP' },
            tun_nexthop_ip:    { kind: 'ip',   label: 'Tunnel Next Hop IP' },
            tun_routed_subnet: { kind: 'cidr', label: 'Tunnel Routed Subnet' },
            dest_ip_ovpn:      { kind: 'ip',   label: 'OpenVPN Dest IP' },
            dest_ipsec:        { kind: 'ip',   label: 'IPsec Dest IP' },
            forwarding_port:   { kind: 'port', label: 'Forwarding Port' },
            dest_ip:           { kind: 'ip',   label: 'Final Destination IP' },
            sPort:             { kind: 'port', label: 'OpenVPN Listening Port' }
        };

        // Returns a short problem description, or null when the value is acceptable.
        function problemWith(kind, v) {
            if (!v) return 'is required';
            switch (kind) {
                case 'ip':   return parseIPv4(v) ? null : '"' + v + '" is not a valid IPv4 address (e.g. 10.60.31.166)';
                case 'cidr': return parseCIDR(v) ? null : '"' + v + '" must be IPv4/prefix (e.g. 10.60.31.160/28)';
                case 'port': return isInt(v, 1, 65535) ? null : '"' + v + '" must be a port number 1-65535';
                case 'vni':  return isInt(v, 1, 16777215) ? null : '"' + v + '" must be a number 1-16777215';
                default:     return null;
            }
        }

        // Sanity checks ACROSS fields. These are warnings, not errors: the
        // deploy can proceed after confirmation, because unusual-but-intended
        // layouts exist (e.g. a /32 tunnel address with an off-link next hop).
        function crossChecks(vals) {
            const warnings = [];
            const subnet = vals.tun_routed_subnet ? parseCIDR(vals.tun_routed_subnet) : null;
            if (subnet && subnet.addr !== subnet.network) {
                warnings.push('Tunnel Routed Subnet ' + vals.tun_routed_subnet + ' has host bits set - did you mean '
                              + intToIp(subnet.network) + '/' + subnet.prefix + '?');
            }
            const iface = vals.tun_interface_ip ? parseCIDR(vals.tun_interface_ip) : null;
            const nexthop = vals.tun_nexthop_ip ? parseIPv4(vals.tun_nexthop_ip) : null;
            if (iface && nexthop && iface.prefix < 32 && !inNetwork(nexthop, iface)) {
                warnings.push('Tunnel Next Hop ' + vals.tun_nexthop_ip + ' is not inside Tunnel Interface IP ' + vals.tun_interface_ip);
            }
            ['dest_ip_ovpn', 'dest_ipsec'].forEach(function (id) {
                const ip = vals[id] ? parseIPv4(vals[id]) : null;
                if (subnet && ip && !inNetwork(ip, subnet)) {
                    warnings.push(RULES[id].label + ' ' + vals[id] + ' is not inside Tunnel Routed Subnet ' + vals.tun_routed_subnet);
                }
            });
            return warnings;
        }
        // --- pure validation helpers (end) ---

        // ---- Feedback rendered in the page. window.alert() is unreliable
        //      inside Telegram Mini Apps, so nothing here depends on it. ----
        function clearFeedback() {
            document.querySelectorAll('.invalid').forEach(function (el) { el.classList.remove('invalid'); });
            document.querySelectorAll('.field-error').forEach(function (el) { el.remove(); });
            const box = document.getElementById('form_messages');
            box.innerHTML = '';
            box.className = 'msg-box hidden';
        }
        function markInvalid(el, msg) {
            el.classList.add('invalid');
            const note = document.createElement('div');
            note.className = 'field-error';
            note.textContent = msg;
            el.insertAdjacentElement('afterend', note);
        }
        function showMessages(title, items, cls) {
            const box = document.getElementById('form_messages');
            box.className = 'msg-box ' + cls;
            const head = document.createElement('div');
            head.textContent = title;
            const ul = document.createElement('ul');
            items.forEach(function (m) {
                const li = document.createElement('li');
                li.textContent = m;   // textContent: typed values are never parsed as HTML
                ul.appendChild(li);
            });
            box.appendChild(head);
            box.appendChild(ul);
        }
        // Typing in a field clears its red mark straight away.
        document.querySelectorAll('#form_container input').forEach(function (el) {
            el.addEventListener('input', function () {
                el.classList.remove('invalid');
                const n = el.nextElementSibling;
                if (n && n.classList.contains('field-error')) n.remove();
            });
        });
        function haptic(type) {
            try { Telegram.WebApp.HapticFeedback.notificationOccurred(type); } catch (e) { /* older client */ }
        }
        function confirmDeploy(message, cb) {
            try {
                if (Telegram.WebApp.isVersionAtLeast('6.2')) { Telegram.WebApp.showConfirm(message, cb); return; }
            } catch (e) { /* fall through to the browser dialog */ }
            cb(window.confirm(message));
        }

        // Validate every VISIBLE input. Marks bad fields in place and returns
        // {errors: [...], warnings: [...]}. Values are trimmed in the inputs
        // themselves so the payload carries exactly what was checked.
        function validateForm() {
            clearFeedback();
            const errors = [];
            const vals = {};
            Object.keys(RULES).forEach(function (id) {
                const el = document.getElementById(id);
                if (el.closest('.hidden')) return;      // not part of this deployment type
                const v = el.value.trim();
                el.value = v;
                const problem = problemWith(RULES[id].kind, v);
                if (problem) {
                    errors.push(RULES[id].label + ' ' + problem);
                    markInvalid(el, problem);
                } else {
                    vals[id] = v;
                }
            });
            const warnings = errors.length ? [] : crossChecks(vals);
            return { errors: errors, warnings: warnings };
        }

        function submitForm(actionType) {
            const result = validateForm();

            if (result.errors.length) {
                showMessages('⛔ Fix these before deploying:', result.errors, 'msg-error');
                haptic('error');
                const first = document.querySelector('input.invalid');
                if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); first.focus(); }
                return;   // nothing is sent to the bot
            }

            const data = {
                action: actionType,
                provider: document.getElementById('provider').value,
                region_ID: document.getElementById('region_ID').value,
                vps_hostname_A: document.getElementById('vps_hostname_A').value,
                vps_hostname_B: document.getElementById('vps_hostname_B').value,
                tun_type: document.getElementById('tun_type').value,
                vxlan_id: document.getElementById('vxlan_id').value,
                tun_pub_dest_ip: document.getElementById('tun_pub_dest_ip').value,
                tun_interface_ip: document.getElementById('tun_interface_ip').value,
                tun_nexthop_ip: document.getElementById('tun_nexthop_ip').value,
                tun_routed_subnet: document.getElementById('tun_routed_subnet').value,
                dest_ip_ovpn: document.getElementById('dest_ip_ovpn').value,
                dest_ipsec: document.getElementById('dest_ipsec').value,
                forwarding_port: document.getElementById('forwarding_port').value,
                dest_ip: document.getElementById('dest_ip').value,
                tcp_udp: document.getElementById('tcp_udp').value,
                OpenVPN_Port: document.getElementById('sPort').value
            };
            const payload = JSON.stringify(data);
            const send = function () { Telegram.WebApp.sendData(payload); };

            if (result.warnings.length) {
                showMessages('⚠️ Please double-check:', result.warnings, 'msg-warn');
                haptic('warning');
                confirmDeploy(result.warnings.length + ' value(s) look unusual (see the orange box). Deploy anyway?',
                              function (ok) { if (ok) send(); });
                return;
            }

            send();
        }
    </script>
</body>
</html>
